<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plex Ambilight</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <img src="../../icons/icon-48.png" alt="" class="logo" width="24" height="24">
      <h1 class="title">Plex Ambilight</h1>
    </header>

    <div class="toggle-row">
      <span class="toggle-label">Ambilight</span>
      <button id="toggle-btn" class="toggle-btn" role="switch" aria-checked="false">
        <span class="toggle-knob"></span>
      </button>
    </div>

    <div class="status" id="status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Loading...</span>
    </div>

    <div class="settings-section" id="settings-section">
      <div class="setting">
        <label for="intensity">Intensity</label>
        <input type="range" id="intensity" min="0.1" max="1.0" step="0.05" value="0.7">
        <span class="setting-value" id="intensity-value">70%</span>
      </div>
      <div class="setting">
        <label for="spread">Spread</label>
        <input type="range" id="spread" min="40" max="250" step="10" value="120">
        <span class="setting-value" id="spread-value">120px</span>
      </div>
      <div class="setting">
        <label for="blur">Blur</label>
        <input type="range" id="blur" min="20" max="160" step="5" value="80">
        <span class="setting-value" id="blur-value">80px</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
